<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Gestão — Alive</title>
<link rel="icon" type="image/png" href="assets/alive-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body class="dash">

<header class="dash-top">
  <img src="assets/alive-logo.png" alt="Alive">
  <div class="dash-user">
    <span id="hello"></span>
    <button class="btn btn-ghost btn-sm" id="btnLogout">Sair</button>
  </div>
</header>

<main class="dash-main">
  <h1>Clientes & Sites</h1>
  <p class="dash-sub">Controle de projetos, planos, mensalidades e pagamentos.</p>

  <div class="kpis">
    <div class="kpi k-blue"><strong id="kTotal">0</strong><span>Clientes</span></div>
    <div class="kpi k-green"><strong id="kNoAr">0</strong><span>Sites no ar</span></div>
    <div class="kpi k-blue"><strong id="kMRR">R$ 0</strong><span>Receita recorrente / mês</span></div>
    <div class="kpi k-red"><strong id="kAtraso">0</strong><span>Pagamentos em atraso</span></div>
  </div>

  <div class="dash-bar">
    <input type="search" id="busca" placeholder="Buscar cliente ou site...">
    <select id="fPagamento">
      <option value="">Pagamento: todos</option>
      <option value="Em dia">Em dia</option>
      <option value="Pendente">Pendente</option>
      <option value="Atrasado">Atrasado</option>
    </select>
    <select id="fStatus">
      <option value="">Site: todos</option>
      <option value="No ar">No ar</option>
      <option value="Em desenvolvimento">Em desenvolvimento</option>
      <option value="Manutenção">Manutenção</option>
      <option value="Pausado">Pausado</option>
    </select>
    <button class="btn btn-primary btn-sm" id="btnNovo">+ Novo cliente</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Cliente</th><th>Plano</th><th>Implementação</th><th>Recorrência</th><th>Pagamento</th><th>Site</th><th>Próx. venc.</th><th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" hidden>Nenhum cliente encontrado. Clique em <strong>+ Novo cliente</strong> para começar.</div>
  </div>
</main>

<!-- Modal cadastro/edição -->
<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <h2 id="modalTitle">Novo cliente</h2>
    <form id="clientForm">
      <input type="hidden" id="cId">
      <label>Nome do cliente <input type="text" id="cNome" required></label>
      <label>Contato (WhatsApp / e-mail) <input type="text" id="cContato"></label>
      <label>Site (endereço) <input type="text" id="cSite" placeholder="www.exemplo.com.br"></label>
      <label>Repositório (GitHub) <input type="text" id="cRepo" placeholder="github.com/usuario/projeto"></label>
      <label>Plano
        <select id="cPlano">
          <option>Essencial</option>
          <option>Profissional</option>
          <option>Premium</option>
          <option>Condição Especial</option>
        </select>
      </label>
      <div class="field-pair">
        <label>Implementação (R$) <input type="number" id="cImplValor" min="0" step="0.01" value="0"></label>
        <label>Situação
          <select id="cImplStatus">
            <option>Pendente</option><option>Pago</option>
          </select>
        </label>
      </div>
      <div class="field-pair">
        <label>Recorrência (R$) <input type="number" id="cRecValor" min="0" step="0.01" value="0"></label>
        <label>Período
          <select id="cRecPeriodo">
            <option>Mensal</option><option>Anual</option>
          </select>
        </label>
      </div>
      <label>Situação do pagamento
        <select id="cPagamento">
          <option>Em dia</option><option>Pendente</option><option>Atrasado</option>
        </select>
      </label>
      <label>Status do site
        <select id="cStatusSite">
          <option>Em desenvolvimento</option><option>No ar</option><option>Manutenção</option><option>Pausado</option>
        </select>
      </label>
      <label>Próximo vencimento <input type="date" id="cProxVenc"></label>
      <label>Observações <textarea id="cObs" rows="3"></textarea></label>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost btn-sm" id="btnCancelar">Cancelar</button>
        <button type="submit" class="btn btn-primary btn-sm">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script src="js/dashboard.js?v=3"></script>
</body>
</html>
